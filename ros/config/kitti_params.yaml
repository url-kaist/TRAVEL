# ROS 2 parameters for travel_node, tuned for KITTI 64-channel scans.
# Mirrors the C++ defaults used by cpp/examples/run_travel_kitti.cpp and the
# regression harness so the node and the standalone tools agree on what
# "KITTI defaults" means.
travel_node:
  ros__parameters:
    lidar:
      min_range: 1.0
      max_range: 80.0
      vert_scan: 64
      horz_scan: 4500
      min_vert_angle: -24.8
      max_vert_angle: 2.0
    tgs:
      resolution: 8.0
      num_iter: 3
      num_lpr: 5
      num_min_pts: 10
      th_seeds: 0.5
      th_dist: 0.125
      th_outlier: 0.3
      th_normal: 0.940
      th_weight: 200.0
      th_lcc_normal: 0.03
      th_lcc_planar: 0.1
      th_obstacle: 1.0
      refine_mode: true
    aos:
      th_horz_merg: 0.4
      th_vert_merg: 0.5
      vert_scan_size: 3
      horz_scan_size: 5
      horz_extension_size: 5
      horz_skip_size: 5
      downsample: 1
      min_cluster_size: 10
      max_cluster_size: 30000
      # -1 = std::random_device shuffle (default); set to a fixed
      # non-negative integer to make output bit-reproducible.
      seed: -1
