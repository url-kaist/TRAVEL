name: KITTI regression

# Run the C++ regression harness in cpp/tests/regression_kitti.cpp on a real
# KITTI scan and bit-compare its output to the gold dump committed in
# cpp/tests/data/. Fails the workflow if the algorithm produces a different
# ground mask or a different (canonicalized) cluster partition than the gold.
#
# The KITTI .bin input is hosted as a GitHub release asset (test-data-v1)
# rather than committed to the repo, so the repo stays small and the asset
# can be replaced without rewriting history.

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - '.github/workflows/kitti-regression.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/kitti-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (PCL + Boost + Eigen)
        # libopenmpi-dev is needed because Ubuntu 22.04's libpcl-dev pulls in
        # VTK 9.1 which transitively imports MPI::MPI_C in its CMake config.
        # Without it the find_package(PCL) configure step fails with
        # "VTK::mpi link interface MPI::MPI_C not found".
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libeigen3-dev \
            libboost-system-dev libboost-filesystem-dev \
            libpcl-dev libopenmpi-dev

      - name: Print toolchain
        run: |
          g++ --version | head -1
          cmake --version | head -1
          dpkg -l | grep libpcl-dev | awk '{print $2, $3}'

      - name: Download KITTI fixture
        run: |
          mkdir -p /tmp/travel_fixtures
          curl -L --fail \
            -o /tmp/travel_fixtures/kitti00_000000.bin \
            https://github.com/url-kaist/TRAVEL/releases/download/test-data-v1/kitti00_000000.bin
          ls -la /tmp/travel_fixtures/
          # Sanity-check size (124,668 points * 4 floats * 4 bytes = 1,994,688)
          test "$(stat -c%s /tmp/travel_fixtures/kitti00_000000.bin)" = "1994688"

      - name: Configure & build regression test
        run: |
          cmake -S cpp/travel -B build -DTRAVEL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regression_kitti -j

      - name: Run regression (bit-compare against gold)
        run: |
          ./build/tests/regression_kitti \
            /tmp/travel_fixtures/kitti00_000000.bin \
            /tmp/run_dump.bin \
            cpp/tests/data/kitti00_000000_gold.bin

      - name: Upload run dump on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run_dump
          path: /tmp/run_dump.bin
          retention-days: 7
